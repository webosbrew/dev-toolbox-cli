name: Build Test

on:
  push:
    # Don't run for tags
    tags-ignore:
      - 'v**'
    branches:
      - '**'

jobs:
  # Path handling differs per host: `canonicalize` returns a `\\?\` verbatim path
  # on Windows and resolves symlinks (`/var` -> `/private/var`) on macOS. Build
  # and test on all three so those bugs cannot hide on one host.
  test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Rust Stable
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Run Tests
        run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Rust Stable
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Rust Stable
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deb-${{ runner.os }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Packages
        run: |
          for f in packages/*; do
            cargo deb -p "$(basename "$f")" || exit 1
          done
