name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  release:
    types: [ released ]

jobs:
  # Debian packages, one per tool, for apt users.
  debian:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 to keep the glibc requirement low.
          - runs-on: ubuntu-22.04
            arch: amd64
          - runs-on: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update Packages
        shell: bash
        run: sudo apt-get -yq update

      - name: Use Rust Stable
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deb-${{ matrix.arch }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Packages
        run: |
          for f in packages/*; do
            cargo deb -p "$(basename "$f")" || exit 1
          done

      - name: Upload Packages (Ubuntu ${{ matrix.arch }})
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: target/debian/*.deb
